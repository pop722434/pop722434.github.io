<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Capy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000; color: #e6edf3; display: flex; align-items: center; justify-content: center;
    }
    .box { text-align: center; }
    .box h1 { font-size: 72px; font-weight: 800; letter-spacing: -2px; color: #e6edf3; line-height: 1; margin-bottom: 8px; }
    .box p { font-size: 14px; color: #6b7280; font-weight: 300; margin-bottom: 24px; }
    .box a { color: #9ca3af; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); padding: 10px 24px; border-radius: 8px; font-size: 13px; transition: all 0.2s; display: inline-block; }
    .box a:hover { border-color: rgba(255,255,255,0.25); color: #e6edf3; background: rgba(255,255,255,0.04); }
    .box .dot { color: #484f58; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>nothing here<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
    <a href="/">go back</a>
  </div>
</body>
</html>
