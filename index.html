<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; height: auto; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000; color: #e6edf3; line-height: 1.7;
      overflow-y: scroll;
      background-image: url('https://preview.redd.it/what-do-you-think-humanity-did-after-the-ending-of-the-2005-v0-9f1z1324rpqe1.jpeg?auto=webp&s=85d566fac420a04ba0ed0462d6af18469e052373');
      background-size: cover; background-position: center;
      background-attachment: fixed; background-repeat: no-repeat;
    }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.3) 100%);
      z-index: -1;
    }
    canvas#particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .trail-dot {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 9999;
      background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.2) 100%);
      transform: translate(-50%, -50%);
    }
    #loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      cursor: pointer; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .bar { width: 220px; height: 3px; background: #1a1a2e; border-radius: 4px; overflow: hidden; }
    #loader .bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, #444, #aaa, #fff); border-radius: 4px; transition: width 0.3s ease; background-size: 200%; animation: gradShift 2s linear infinite; }
    @keyframes gradShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    #loader .text { color: #8b949e; font-size: 13px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; transition: opacity 0.3s ease; }
    #loader .enter-btn {
      opacity: 0; transition: all 0.5s ease;
      padding: 12px 32px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500;
      background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
      cursor: pointer; letter-spacing: 1px;
    }
    #loader .enter-btn:hover { border-color: #fff; background: rgba(255,255,255,0.1); box-shadow: 0 0 24px rgba(255,255,255,0.1); }
    #loader.show-btn .enter-btn { opacity: 1; }
    .avatar-wrap {
      position: relative; margin: 50px auto 0;
      width: 150px; height: 150px;
    }
    .avatar-wrap::before {
      content: ''; position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
      z-index: -1;
      animation: avatarPulse 3s ease-in-out infinite;
    }
    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.15); }
      50% { box-shadow: 0 0 40px 8px rgba(255,255,255,0.08); }
    }
    .avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .spacer { height: 30px; }
    .content { padding: 0 24px 60px; max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
    .handle { text-align: center; margin-bottom: 4px; }
    .handle h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #fff 30%, #888 70%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    .handle .at { color: #6b7280; font-size: 14px; font-weight: 400; }
    .bio { text-align: center; margin: 24px 0; color: #9ca3af; font-size: 15px; font-weight: 300; max-width: 480px; margin-left: auto; margin-right: auto; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 28px 0; flex-wrap: wrap; }
    .stat { color: #6b7280; font-size: 14px; font-weight: 300; }
    .panel {
      background: rgba(10,12,18,0.6); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 28px; margin-bottom: 24px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative; overflow: hidden;
      opacity: 0; transform: translateY(40px);
    }
    .panel.visible { opacity: 1; transform: translateY(0); }
    .panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }
    .panel::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent);
    }
    .panel:hover {
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 0 50px rgba(255,255,255,0.04), inset 0 0 50px rgba(255,255,255,0.02);
      transform: translateY(-4px) scale(1.005);
    }
    .panel h3 { font-size: 15px; color: #e6edf3; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    .panel p { font-size: 14px; color: #9ca3af; font-weight: 300; line-height: 1.9; }
    .panel p + p { margin-top: 8px; }
    .footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 12px; color: #484f58; font-weight: 300; }
    .music-player {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: rgba(10,12,18,0.7); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 16px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s ease; min-width: 100px;
      overflow: hidden;
    }
    .music-player::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    .music-player:hover { border-color: rgba(255,255,255,0.15); box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .music-player img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .music-player img.spinning { animation: spin 3s linear infinite; }
    .music-player .player-info { flex: 1; min-width: 0; }
    .music-player .player-info .song-title { font-size: 13px; color: #e6edf3; font-weight: 500; white-space: nowrap; }
    .music-player .player-info .song-artist { font-size: 11px; color: #6b7280; font-weight: 300; }
    .music-player.mini { padding: 8px 12px; gap: 8px; min-width: auto; top: 10px; right: 10px; }
    .music-player.mini img { width: 32px; height: 32px; }
    .music-player.mini .player-info .song-title { font-size: 12px; max-width: 100px; }
    .music-player.mini .player-info .song-artist { display: none; }
    .music-player.mini .viz { display: none; }
    .music-player.mini .progress-wrap { display: none; }
    .music-player.mini #shuffleBtn, .music-player.mini #repeatBtn,
    .music-player.mini .controls span { display: none; }
    .music-player.mini input[type="range"] { display: none; }
    .playlist-btn { position: relative; }
    .playlist-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 14px; height: 14px; padding: 0 4px;
      border-radius: 7px; background: #fff; color: #000;
      font-size: 9px; font-weight: 700; line-height: 14px; text-align: center;
      pointer-events: none;
    }
    .music-player audio { display: none; }
    .music-player .controls { display: flex; gap: 6px; align-items: center; }
    .music-player .controls button {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: #d1d5db; border-radius: 8px; padding: 6px 10px;
      cursor: pointer; font-size: 12px; transition: all 0.2s;
      font-variant-emoji: text;
    }
    .music-player .controls button:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
    .music-player input[type="range"] {
      width: 56px; height: 3px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; cursor: pointer;
    }
    .music-player input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.3);
    }
    .progress-wrap {
      width: 100%; display: flex; align-items: center; gap: 8px;
      position: relative; order: 1; margin-top: 2px;
    }
    .progress-bar {
      flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #444, #aaa, #fff);
      border-radius: 2px; transition: width 0.1s linear; background-size: 200%; animation: gradShift 2s linear infinite;
    }
    .progress-wrap .time-current,
    .progress-wrap .time-total {
      font-size: 10px; color: #6b7280; min-width: 28px; text-align: center; font-weight: 300;
    }
    .viz {
      display: flex; align-items: flex-end; gap: 2px; height: 24px;
      margin-left: auto;
    }
    .viz div {
      width: 3px; height: 4px;
      background: linear-gradient(to top, rgba(255,255,255,0.3), #fff);
      border-radius: 2px;
      transition: height 0.1s ease;
    }
    @keyframes charFade {
      0% { opacity: 0; filter: blur(4px); }
      100% { opacity: 1; filter: blur(0); }
    }
    .char-anim span {
      display: inline-block;
      animation: charFade 0.5s ease forwards;
      opacity: 0;
    }
    .scroll-hint {
      text-align: center; margin: 10px 0 0; font-size: 11px;
      color: #484f58; animation: scrollBob 2s ease-in-out infinite;
      letter-spacing: 1px; text-transform: uppercase;
    }
    @keyframes scrollBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    .playlist-btn { font-size: 16px; line-height: 1; padding: 6px 8px !important; }
    .shuffle-btn, .repeat-btn, .lyrics-btn { font-size: 14px; line-height: 1; padding: 6px 7px !important; }
    .shuffle-btn.active, .repeat-btn.active {
      background: rgba(255,255,255,0.12) !important;
      border-color: rgba(255,255,255,0.3) !important;
      color: #fff !important;
    }
    .repeat-btn.one { color: #fff !important; }
    .playlist-panel {
      position: fixed; top: 170px; right: 20px; z-index: 99;
      background: rgba(10,12,18,0.85); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 8px; min-width: 260px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      opacity: 0; transform: translateY(-8px) scale(0.95);
      pointer-events: none; transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 380px; overflow-y: auto;
    }
    .playlist-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .playlist-panel::-webkit-scrollbar { width: 3px; }
    .playlist-panel::-webkit-scrollbar-track { background: transparent; }
    .playlist-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .playlist-header {
      padding: 6px 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;
    }
    .playlist-header .ph-title { font-size: 11px; color: #8b949e; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }
    .playlist-header .ph-count { font-size: 10px; color: #484f58; font-weight: 300; }
    .playlist-tabs { display: flex; gap: 4px; }
    .playlist-tab {
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08); color: #6b7280;
      background: transparent; transition: all 0.2s;
    }
    .playlist-tab:hover { border-color: rgba(255,255,255,0.15); color: #9ca3af; }
    .playlist-tab.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #e6edf3; }
    .playlist-search {
      margin: 4px 8px 8px; padding: 6px 10px; width: calc(100% - 16px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      background: rgba(255,255,255,0.04); color: #e6edf3;
      font-size: 12px; font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s;
    }
    .playlist-search:focus { border-color: rgba(255,255,255,0.2); }
    .playlist-search::placeholder { color: #484f58; }
    .playlist-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      border: 1px solid transparent;
    }
    .playlist-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
    .playlist-item.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .playlist-item .pi-num {
      font-size: 11px; color: #484f58; font-weight: 300;
      min-width: 20px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .playlist-item.active .pi-num { color: #e6edf3; }
    .playlist-item .pi-img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .playlist-item .pi-info { flex: 1; min-width: 0; }
    .playlist-item .pi-title { font-size: 12px; color: #e6edf3; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item .pi-artist { font-size: 10px; color: #6b7280; font-weight: 300; }
    .playlist-item .pi-warn {
      font-size: 8px; font-weight: 700; letter-spacing: 1px;
      color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3);
      border-radius: 3px; padding: 1px 4px; margin-left: 4px;
      flex-shrink: 0; line-height: 1.2;
    }
    .playlist-item .pi-dur {
      font-size: 10px; color: #484f58; font-weight: 300;
      min-width: 30px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .pi-eq {
      display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0;
    }
    .pi-eq div {
      width: 2px; border-radius: 1px;
      background: linear-gradient(to top, #666, #fff);
      animation: eqAnim 0.6s ease-in-out infinite alternate;
    }
    .pi-eq div:nth-child(1) { height: 50%; animation-delay: 0s; }
    .pi-eq div:nth-child(2) { height: 100%; animation-delay: 0.15s; }
    .pi-eq div:nth-child(3) { height: 35%; animation-delay: 0.3s; }
    @keyframes eqAnim {
      0% { transform: scaleY(0.4); transform-origin: bottom; }
      100% { transform: scaleY(1); transform-origin: bottom; }
    }
    .bg-viz {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: -2; opacity: 0.65;
    }
    .pi-drag {
      font-size: 10px; color: #484f58; cursor: grab; flex-shrink: 0;
      padding: 0 2px 0 0; user-select: none; line-height: 1;
    }
    .playlist-item[draggable=true] { cursor: grab; }
    .playlist-item.dragging { opacity: 0.3; }
    .playlist-item.drag-over { border-color: rgba(255,255,255,0.25) !important; background: rgba(255,255,255,0.08) !important; }
    .lyrics-panel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.9);
      width: min(560px,calc(100vw - 40px)); max-height: 75vh;
      background: rgba(8,10,16,0.94); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
      padding: 0; z-index: 1000;
      opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
      overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    .lyrics-panel.open { opacity: 1; transform: translate(-50%,-50%) scale(1); pointer-events: auto; }
    .lyrics-panel::-webkit-scrollbar { width: 3px; }
    .lyrics-panel::-webkit-scrollbar-track { background: transparent; }
    .lyrics-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    .lyrics-close {
      position: fixed; top: 12px; right: 16px; font-size: 18px; cursor: pointer;
      color: #484f58; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; padding: 4px 8px; line-height: 1; z-index: 2; transition: all 0.2s;
    }
    .lyrics-close:hover { color: #e6edf3; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
    .lyrics-header {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px 12px;
      background: linear-gradient(180deg,rgba(8,10,16,1) 60%,rgba(8,10,16,0));
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .lyrics-header img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .lyrics-header div { flex: 1; min-width: 0; }
    .lyrics-header .lh-title { font-size: 13px; color: #e6edf3; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lyrics-header .lh-artist { font-size: 11px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lyrics-body { padding: 12px 24px 32px; }
    .lyrics-line {
      padding: 7px 0 7px 20px; font-size: 15px; color: #484f58;
      transition: all 0.45s cubic-bezier(0.22,1,0.36,1);
      line-height: 1.8; text-align: center;
      border-left: 2px solid transparent;
    }
    .lyrics-line.active {
      color: #fff; font-size: 19px; font-weight: 500;
      border-left-color: rgba(255,255,255,0.4);
      text-shadow: 0 0 30px rgba(255,255,255,0.1);
    }
    .lyrics-line.past { color: #3a3f47; font-size: 13px; opacity: 0.4; }
    .lyrics-instr { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 4px 0; height: 20px; }
    .lyrics-instr span { width: 3px; height: 3px; border-radius: 50%; background: #484f58; animation: instrPulse 1.4s ease-in-out infinite; }
    .lyrics-instr span:nth-child(2) { animation-delay: 0.25s; }
    .lyrics-instr span:nth-child(3) { animation-delay: 0.5s; }
    @keyframes instrPulse { 0%, 100% { opacity: 0.15; transform: scale(0.5); } 50% { opacity: 0.7; transform: scale(1); } }
    .lyrics-line .lyr-word { transition: color 0.25s ease; }
    .lyrics-line .lyr-word.past { color: rgba(255,255,255,0.85); }
    .lyrics-line .lyr-word.active { background: linear-gradient(to right, #fff var(--fill,0%), rgba(255,255,255,0.2) var(--fill,0%)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lyrics-line .lyr-word.future { color: #484f58; }
    .lyrics-loading, .lyrics-error { text-align: center; padding: 60px 0; font-size: 13px; }
    .lyrics-loading { color: #6b7280; }
    .lyrics-error { color: #f85149; }
  </style>
</head>
<body>
  <canvas id="bgViz" class="bg-viz"></canvas>
  <canvas id="particles"></canvas>
  <div id="loader">
    <div class="bar"><div class="bar-inner" id="loadBar"></div></div>
    <div class="text">Loading...</div>
    <div class="enter-btn" id="enterBtn">Click to Enter</div>
  </div>
  
  <div class="avatar-wrap"><img src="https://images-ext-1.discordapp.net/external/MnFq7Ayc_rOQQaCTWb2t9lwyhigo69zaugW7tV3XBpc/%3Fsize%3D512/https/cdn.discordapp.com/avatars/1139133371683971093/6b941183dd830d0df1a4ce95cb03259b.png?format=webp&quality=lossless" alt="avatar"></div>
  <div class="music-player">
    <img src="song.webp" alt="album art" onerror="this.style.display='none'">
    <div class="player-info">
      <div class="song-title">Seasons In The Sun</div>
      <div class="song-artist">Nirvana</div>
    </div>
    <div class="controls">
      <button id="prevBtn" title="Previous">⏮</button>
      <button id="playBtn">▶</button>
      <button id="pauseBtn">⏸</button>
      <button id="nextBtn" title="Next">⏭</button>
      <button id="shuffleBtn" class="shuffle-btn" title="Shuffle">🔀</button>
      <button id="repeatBtn" class="repeat-btn" title="Repeat">🔁</button>
      <span style="color:#6b7280;font-size:11px;font-weight:300">Vol</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
      <button id="downloadBtn" title="Download">⬇</button>
      <button id="lyricsToggle" class="lyrics-btn" title="Lyrics">🎤</button>
      <button class="playlist-btn" id="playlistToggle" title="Playlist">☰<span class="playlist-badge" id="playlistBadge">0</span></button>

          for (var i = 0; i < allWords.length; i++) { allWords[i].className = 'lyr-word'; allWords[i].style.setProperty('--fill','0%'); allWords[i].style.background = ''; allWords[i].style.setProperty('-webkit-background-clip',''); allWords[i].style.setProperty('-webkit-text-fill-color',''); }
        }
        if (lineIdx >= 0) {
          var line = currentLyrics[lineIdx];
          var wordIdx = -1;
          for (var w = line.words.length - 1; w >= 0; w--) {
            if (ct >= line.words[w].start) { wordIdx = w; break; }
          }
          var lineEl = body.querySelector('[data-lyr="' + lineIdx + '"]');
          if (lineEl) lineEl.classList.add('active');
          for (var pi = 0; pi < lineIdx; pi++) {
            if (currentLyrics[pi] && currentLyrics[pi].words && currentLyrics[pi].words.length > 0) {
              var pel = body.querySelector('[data-lyr="' + pi + '"]');
              if (pel) pel.classList.add('past');
              for (var pw = 0; pw < currentLyrics[pi].words.length; pw++) {
                var pwel = body.querySelector('[data-wi="' + pi + '-' + pw + '"]');
                if (pwel) { pwel.className = 'lyr-word past'; pwel.style.background = ''; pwel.style.setProperty('-webkit-background-clip',''); pwel.style.setProperty('-webkit-text-fill-color',''); }
              }
            }
          }
          for (var w = 0; w < line.words.length; w++) {
            var wel = body.querySelector('[data-wi="' + lineIdx + '-' + w + '"]');
            if (!wel) continue;
            if (w < wordIdx) { wel.className = 'lyr-word past'; wel.style.background = ''; wel.style.setProperty('-webkit-background-clip',''); wel.style.setProperty('-webkit-text-fill-color',''); }
            else if (w === wordIdx) {
              var wStart = line.words[w].start;
              var wEnd = (w + 1 < line.words.length) ? line.words[w + 1].start : ((lineIdx + 1 < currentLyrics.length && currentLyrics[lineIdx + 1].lineStart > line.lineStart) ? currentLyrics[lineIdx + 1].lineStart : wStart + 2);
              var pct = Math.min(1, Math.max(0, (ct - wStart) / (wEnd - wStart))) * 100;
              wel.className = 'lyr-word active';
              wel.style.setProperty('--fill', pct + '%');
              wel.style.background = 'linear-gradient(to right, #fff ' + pct + '%, rgba(255,255,255,0.2) ' + pct + '%)';
              wel.style.setProperty('-webkit-background-clip', 'text');
              wel.style.setProperty('-webkit-text-fill-color', 'transparent');
            } else { wel.className = 'lyr-word future'; wel.style.background = ''; wel.style.setProperty('-webkit-background-clip',''); wel.style.setProperty('-webkit-text-fill-color',''); }
          }
          if (lChanged && lineEl) lineEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
        return;
      }

      var idx = -1;
      for (var i = currentLyrics.length - 1; i >= 0; i--) {
        if (currentLyrics[i].time >= 0 && ct >= currentLyrics[i].time) { idx = i; break; }
      }
      var lineChanged = idx !== currentLineIdx;
      if (lineChanged) {
        currentLineIdx = idx;
        var allLines = body.querySelectorAll('.lyrics-line');
        for (var i = 0; i < allLines.length; i++) {
          allLines[i].classList.remove('active', 'past');
          allLines[i].style.background = ''; allLines[i].style.setProperty('-webkit-background-clip',''); allLines[i].style.setProperty('-webkit-text-fill-color','');
        }
        for (var i = 0; i < idx; i++) {
          if (currentLyrics[i] && currentLyrics[i].time >= 0 && currentLyrics[i].text) {
            var el = body.querySelector('[data-lyr="' + i + '"]');
            if (el) el.classList.add('past');
          }
        }
      }
      if (idx >= 0 && currentLyrics[idx] && currentLyrics[idx].text) {
        var el = body.querySelector('[data-lyr="' + idx + '"]');
        if (!el) return;
        el.classList.add('active');
        var start = currentLyrics[idx].time;
        var end = (idx + 1 < currentLyrics.length && currentLyrics[idx + 1].time >= 0) ? Math.min(currentLyrics[idx + 1].time, start + 1.5) : start + 1.5;
        var pct = Math.min(1, Math.max(0, (ct - start) / (end - start))) * 100;
        el.style.background = 'linear-gradient(to right, #fff ' + pct + '%, rgba(255,255,255,0.2) ' + pct + '%)';
        el.style.setProperty('-webkit-background-clip', 'text');
        el.style.setProperty('-webkit-text-fill-color', 'transparent');
        if (lineChanged) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
    function closeLyrics() { lyricsOpen = false; lyricsPanel.classList.remove('open'); }
    lyricsToggle.onclick = function(e) {
      e.stopPropagation();
      lyricsOpen = !lyricsOpen;
      if (lyricsOpen) {
        lyricsPanel.classList.add('open');
        if (currentLyrics) { renderLyrics(currentLyrics); }
        else { lyricsPanel.innerHTML = '<button class="lyrics-close" id="lyricsCloseL2">✕</button><div class="lyrics-loading">Loading lyrics...</div>'; document.getElementById('lyricsCloseL2').onclick = function(){ closeLyrics(); }; fetchLyrics(currentTrack); }
      } else { closeLyrics(); }
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.lyrics-panel') && !e.target.closest('#lyricsToggle')) {
        if (lyricsOpen) closeLyrics();
      }
    });
    function syncLoop() { syncLyrics(); requestAnimationFrame(syncLoop); }
    requestAnimationFrame(syncLoop);

    function getNextTrack() {
      if (repeatMode === 'one') return currentTrack;
      var n;
      if (shuffleMode) {
        do { n = Math.floor(Math.random() * playlistData.length); }
        while (n === currentTrack && playlistData.length > 1);
        return n;
      }
      n = currentTrack + 1;
      if (n >= playlistData.length) return repeatMode === 'all' ? 0 : -1;
      return n;
    }

    playBtn.onclick = function() {
      if (!audio.src) { loadTrack(0, true); return; }
      audio.play(); img.classList.add('spinning');
    };
    pauseBtn.onclick = function() { audio.pause(); img.classList.remove('spinning'); };
    nextBtn.onclick = function() {
      if (shuffleMode) {
        var n; do { n = Math.floor(Math.random() * playlistData.length); } while (n === currentTrack && playlistData.length > 1);
        loadTrack(n, true);
      } else {
        loadTrack((currentTrack + 1) % playlistData.length, true);
      }
    };
    var prevClickTime = 0;
    prevBtn.onclick = function() {
      var t = Date.now();
      if (t - prevClickTime < 400) {
        audio.currentTime = 0;
        prevClickTime = 0;
        return;
      }
      prevClickTime = t;
      var p = currentTrack - 1;
      if (p < 0) p = playlistData.length - 1;
      loadTrack(p, true);
    };
    shuffleBtn.onclick = function() {
      shuffleMode = !shuffleMode;
      shuffleBtn.classList.toggle('active');
    };
    repeatBtn.onclick = function() {
      var modes = ['all', 'one', 'none'];
      var icons = ['🔁', '🔂', '⏹'];
      var idx = (modes.indexOf(repeatMode) + 1) % modes.length;
      repeatMode = modes[idx];
      repeatBtn.textContent = icons[idx];
      repeatBtn.className = 'repeat-btn' + (repeatMode !== 'none' ? ' active' : '') + (repeatMode === 'one' ? ' one' : '');
    };
    audio.onended = function() {
      img.classList.remove('spinning');
      var n = getNextTrack();
      if (n >= 0) loadTrack(n, true);
    };
    audio.addEventListener('play', function() { renderPlaylist(); });
    audio.addEventListener('pause', function() { renderPlaylist(); });
    volumeSlider.oninput = function() { audio.volume = volumeSlider.value; };
    var downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.onclick = function() {
      var track = playlistData[currentTrack];
      if (!track) return;
      var a = document.createElement('a');
      a.href = track.src;
      a.download = track.title + '.mp3';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { document.body.removeChild(a); }, 100);
    };
    var progressFill = document.getElementById('progressFill');
    var timeCurrent = document.getElementById('timeCurrent');
    var timeTotal = document.getElementById('timeTotal');
    var progressBar = document.getElementById('progressBar');
    audio.addEventListener('loadedmetadata', function() { timeTotal.textContent = formatTime(audio.duration); });
    audio.addEventListener('timeupdate', function() {
      var pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });
    progressBar.addEventListener('click', function(e) {
      var rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });
    var playlistBadge = document.getElementById('playlistBadge');

    var scrollTimer;
    window.addEventListener('scroll', function() {
      clearTimeout(scrollTimer);
      if (window.scrollY > 200) { player.classList.add('mini'); }
      else { scrollTimer = setTimeout(function() { player.classList.remove('mini'); }, 200); }
    });

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); if (audio.paused) { playBtn.click(); } else { pauseBtn.click(); } break;
        case 'ArrowLeft': e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); break;
        case 'ArrowRight': e.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); break;
        case 'ArrowUp': e.preventDefault(); volumeSlider.value = Math.min(1, parseFloat(volumeSlider.value) + 0.1); volumeSlider.oninput(); break;
        case 'ArrowDown': e.preventDefault(); volumeSlider.value = Math.max(0, parseFloat(volumeSlider.value) - 0.1); volumeSlider.oninput(); break;
      }
    });
    function formatTime(s) {
      var m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    var playlistPanel = document.getElementById('playlistPanel');
    var playlistToggle = document.getElementById('playlistToggle');
    playlistToggle.onclick = function(e) { e.stopPropagation(); playlistPanel.classList.toggle('open'); };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.music-player') && !e.target.closest('.playlist-panel')) {
        playlistPanel.classList.remove('open');
      }
    });
    function renderPlaylist() {
      playlistBadge.textContent = playlistData.length;
      playlistPanel.innerHTML = '';
      var header = document.createElement('div');
      header.className = 'playlist-header';
      var tabs = document.createElement('div');
      tabs.className = 'playlist-tabs';
      var langs = ['eng', 'rus'];
      for (var li = 0; li < langs.length; li++) {
        var tab = document.createElement('span');
        tab.className = 'playlist-tab' + (currentTab === langs[li] ? ' active' : '');
        tab.textContent = langs[li];
        tab.onclick = function(l) { return function(e) { e.stopPropagation(); currentTab = l; renderPlaylist(); }; }(langs[li]);
        tabs.appendChild(tab);
      }
      var filteredAll = [];
      for (var fi = 0; fi < playlistData.length; fi++) {
        if (playlistData[fi].lang === currentTab) filteredAll.push(playlistData[fi]);
      }
      header.innerHTML = '<span class="ph-title">Now Playing</span><span class="ph-count">' + filteredAll.length + ' tracks</span>';
      header.appendChild(tabs);
      playlistPanel.appendChild(header);

      var searchInput = document.createElement('input');
      searchInput.className = 'playlist-search';
      searchInput.placeholder = 'Search...';
      if (_searchVal) searchInput.value = _searchVal;
      searchInput.oninput = function() { _searchVal = this.value; renderPlaylist(); var ni = playlistPanel.querySelector('.playlist-search'); if (ni) { ni.focus(); ni.selectionStart = ni.selectionEnd = _searchVal.length; } };
      searchInput.onclick = function(e) { e.stopPropagation(); };
      playlistPanel.appendChild(searchInput);

      var query = (searchInput.value || '').toLowerCase();
      var filtered = [];
      for (var fi2 = 0; fi2 < filteredAll.length; fi2++) {
        var t = filteredAll[fi2];
        if (!query || t.title.toLowerCase().indexOf(query) !== -1 || t.artist.toLowerCase().indexOf(query) !== -1) {
          filtered.push(t);
        }
      }
      for (var i = 0; i < filtered.length; i++) {
        var t = filtered[i];
        var realIdx = playlistData.indexOf(t);
        var item = document.createElement('div');
        item.className = 'playlist-item' + (realIdx === currentTrack ? ' active' : '');
        item.setAttribute('data-real', realIdx);
        var dragHtml = '<span class="pi-drag">⠿</span>';
        var num = '<span class="pi-num">' + (i < 9 ? '0' : '') + (i + 1) + '</span>';
        var artHtml = t.art ? '<img class="pi-img" src="' + t.art + '" onerror="this.style.display=\'none\'">' : '<div class="pi-img"></div>';
        var durHtml = '<span class="pi-dur">' + (t.dur || '--:--') + '</span>';
        var eqHtml = (realIdx === currentTrack && !audio.paused)
          ? '<div class="pi-eq"><div></div><div></div><div></div></div>'
          : '<span class="pi-dur" style="min-width:auto;width:14px"></span>';
        item.innerHTML = dragHtml + num + artHtml + '<div class="pi-info"><div class="pi-title">' + t.title + (t.warn ? '<span class="pi-warn">' + t.warn + '</span>' : '') + '</div><div class="pi-artist">' + t.artist + '</div></div>' + (realIdx === currentTrack ? eqHtml : durHtml);
        if (!query) {
          item.draggable = true;
          item.onclick = function(idx) { return function() { loadTrack(idx, true); }; }(realIdx);
          item.addEventListener('dragstart', function(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.currentTarget.getAttribute('data-real'));
            e.currentTarget.classList.add('dragging');
          });
          item.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); });
          item.addEventListener('dragleave', function(e) { if (!e.currentTarget.contains(e.relatedTarget)) { e.currentTarget.classList.remove('drag-over'); } });
          item.addEventListener('drop', function(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            var from = parseInt(e.dataTransfer.getData('text/plain'));
            var to = parseInt(e.currentTarget.getAttribute('data-real'));
            if (isNaN(from) || isNaN(to) || from === to) return;
            var moved = playlistData.splice(from, 1)[0];
            var newIdx = to;
            if (from < to) newIdx--;
            playlistData.splice(newIdx, 0, moved);
            if (currentTrack === from) currentTrack = newIdx;
            else if (currentTrack > from && currentTrack <= newIdx) currentTrack--;
            else if (currentTrack < from && currentTrack >= newIdx) currentTrack++;
            renderPlaylist();
          });
          item.addEventListener('dragend', function(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
          });
        } else {
          item.onclick = function(idx) { return function() { loadTrack(idx, true); }; }(realIdx);
        }
        playlistPanel.appendChild(item);
      }
      for (var j = 0; j < filtered.length; j++) {
        if (!filtered[j].dur) tryLoadDuration(playlistData.indexOf(filtered[j]));
      }
    }
    function tryLoadDuration(idx) {
      var tmpAudio = new Audio();
      tmpAudio.preload = 'metadata';
      var tid = setTimeout(function() { tmpAudio = null; }, 3000);
      tmpAudio.onloadedmetadata = function() {
        if (!tmpAudio) return;
        clearTimeout(tid);
        var d = formatTime(tmpAudio.duration);
        playlistData[idx].dur = d;
        var items = playlistPanel.querySelectorAll('.playlist-item');
        for (var ki = 0; ki < items.length; ki++) {
          if (parseInt(items[ki].getAttribute('data-real')) === idx) {
            var durEl = items[ki].querySelector('.pi-dur');
            if (durEl) durEl.textContent = d;
            break;
          }
        }
        tmpAudio = null;
      };
      tmpAudio.src = playlistData[idx].src;
    }

    var viz = document.getElementById('viz');
    for (var i = 0; i < 12; i++) {
      var bar = document.createElement('div');
      viz.appendChild(bar);
    }
    var vizBars = viz.children;
    var audioCtx, analyser, dataArray, src;
    function initViz() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateViz() {
          if (audio.paused || audio.ended) { requestAnimationFrame(updateViz); return; }
          analyser.getByteFrequencyData(dataArray);
          for (var i = 0; i < vizBars.length; i++) {
            var val = dataArray[i * 2] / 255;
            vizBars[i].style.height = Math.max(4, val * 22) + 'px';
          }
          requestAnimationFrame(updateViz);
        }
        updateViz();
      } catch(e) {}
    }

    var bgCanvas = document.getElementById('bgViz');
    var bgCtx = bgCanvas.getContext('2d');
    var bgW, bgH;
    function resizeBg() { bgW = bgCanvas.width = window.innerWidth; bgH = bgCanvas.height = window.innerHeight; }
    resizeBg();
    var barCount = 64;
    function drawBgViz() {
      bgCtx.clearRect(0, 0, bgW, bgH);
      if (analyser && dataArray && !audio.paused) {
        analyser.getByteFrequencyData(dataArray);
        var bw = bgW / barCount;
        for (var i = 0; i < barCount; i++) {
          var val = dataArray[Math.floor(i * dataArray.length / barCount)] / 255;
          var barH = val * bgH * 0.45;
          var x = i * bw;
          var grad = bgCtx.createLinearGradient(0, bgH - barH, 0, bgH);
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(0.5, 'rgba(255,255,255,' + (val * 0.3) + ')');
          grad.addColorStop(1, 'rgba(255,255,255,' + (val * 0.55) + ')');
          bgCtx.fillStyle = grad;
          bgCtx.fillRect(x, bgH - barH, bw + 1, barH);
        }
      }
      requestAnimationFrame(drawBgViz);
    }
    drawBgViz();

    var trailDots = [];
    var trailCount = 16;
    for (var i = 0; i < trailCount; i++) {
      var dot = document.createElement('div');
      dot.className = 'trail-dot';
      var size = 6 - i * 0.35;
      dot.style.width = Math.max(2, size) + 'px';
      dot.style.height = Math.max(2, size) + 'px';
      dot.style.opacity = '0';
      document.body.appendChild(dot);
      trailDots.push({ el: dot, x: 0, y: 0, sx: 0, sy: 0 });
    }
    var mx = 0, my = 0;
    document.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
    document.addEventListener('mouseleave', function() { trailDots.forEach(function(d) { d.el.style.opacity = '0'; }); });
    function animateTrail() {
      trailDots[0].el.style.left = mx + 'px';
      trailDots[0].el.style.top = my + 'px';
      trailDots[0].el.style.opacity = '1';
      for (var i = 1; i < trailDots.length; i++) {
        var prev = trailDots[i - 1];
        var curr = trailDots[i];
        var px = parseFloat(prev.el.style.left) || mx;
        var py = parseFloat(prev.el.style.top) || my;
        curr.sx += (px - curr.sx) * 0.25;
        curr.sy += (py - curr.sy) * 0.25;
        curr.el.style.left = curr.sx + 'px';
        curr.el.style.top = curr.sy + 'px';
        curr.el.style.opacity = Math.max(0, 1 - i / trailCount) * 0.9;
      }
      requestAnimationFrame(animateTrail);
    }
    animateTrail();

    var loader = document.getElementById('loader');
    var loadBar = document.getElementById('loadBar');
    var enterBtn = document.getElementById('enterBtn');
    var ww = 0;
    var loadInterval = setInterval(function() {
      ww += Math.random() * 30;
      if (ww >= 100) { ww = 100; clearInterval(loadInterval); }
      loadBar.style.width = ww + '%';
      if (ww >= 100) {
        setTimeout(function() { typeWriteText(loadText, 'Loaded', 50, function() { setTimeout(function() { loader.classList.add('show-btn'); }, 200); }); }, 200);
      }
    }, 100);
    enterBtn.onclick = function() {
      loader.classList.add('hidden'); initViz();
      loadTrack(0, true);
    };
    var loadText = document.querySelector('#loader .text');
    function typeWriteText(el, text, speed, cb) {
      var i = 0; el.textContent = '';
      function tick() { if (i < text.length) { el.textContent += text.charAt(i); i++; setTimeout(tick, speed); } else if (cb) cb(); }
      tick();
    }

    function charAnim(el, text, speed) {
      var i = 0;
      el.innerHTML = '';
      function next() {
        if (i < text.length) {
          var s = document.createElement('span');
          s.textContent = text.charAt(i);
          s.style.animationDelay = (i * speed) + 'ms';
          el.appendChild(s);
          i++;
          setTimeout(next, speed);
        }
      }
      next();
    }

    window.addEventListener('DOMContentLoaded', function() {
      charAnim(document.querySelector('.handle h1'), '『!Сapybara¡』', 40);
      charAnim(document.querySelector('.handle .at'), '@WotwFan', 60);
      charAnim(document.querySelector('.bio'), 'Bad person', 30);
      charAnim(document.querySelector('.stat'), 'idk what to type here', 30);
      var allPanels = document.querySelectorAll('.panel');
      var panelTexts = [
        { h3: 'About', ps: ["Just a random person on the internet. Nothing special here :'"] },
        { h3: 'Interests', ps: ['Roblox exploiting and F3X building :3.'] },
        { h3: 'Projects', ps: ['Nothing serious yet, but working on it.'] },
        { h3: 'Links', ps: ['Discord: sudoeoev', 'Telegram: @WotwFan', 'Usernames u may know: Capybara, 7day, Demidozz1, hummerhow, WotwFan, materialbase_color, Fuzzberry, someonebad, horrible,'] }
      ];
      for (var pi = 0; pi < allPanels.length; pi++) {
        var pt = panelTexts[pi];
        charAnim(allPanels[pi].querySelector('h3'), pt.h3, 40);
        var pps = allPanels[pi].querySelectorAll('p');
        for (var pj = 0; pj < pps.length && pj < pt.ps.length; pj++) {
          charAnim(pps[pj], pt.ps[pj], 25);
        }
      }
      charAnim(document.querySelector('.footer'), ':3', 60);
      renderPlaylist();
    });

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { rootMargin: '0px 0px -60px 0px' });
    document.querySelectorAll('.panel').forEach(function(p) { observer.observe(p); });
  </script>

    <div class="scroll-hint">scroll</div>
  </div>

      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { rootMargin: '0px 0px -60px 0px' });
      obs.observe(p);
    });
