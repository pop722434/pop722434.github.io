<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>『!Сapybara¡』</title>
<meta name="description" content="『!Сapybara¡』 — Discord, Medal, Telegram, TikTok.">
<meta property="og:title" content="『!Сapybara¡』">
<meta property="og:image" content="pfp.webp">
<link rel="icon" href="pfp.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080c;
    --line: rgba(255, 255, 255, .09);
    --text: #eef1f6;
    --muted: #8b93a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .32;
    pointer-events: none;
    z-index: 0;
  }
  .glow-a { width: 440px; height: 440px; background: #7c3aed; top: -150px; left: -130px; animation: drift 16s ease-in-out infinite alternate; }
  .glow-b { width: 400px; height: 400px; background: #0e7490; bottom: -170px; right: -130px; animation: drift 20s ease-in-out infinite alternate-reverse; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(70px, 50px, 0) scale(1.18); }
  }

  .page {
    position: relative;
    z-index: 1;
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .avatar {
    position: relative;
    width: 116px;
    height: 116px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin-bottom: 16px;
    animation: rise .6s ease both;
  }
  .avatar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#7c3aed, #22d3ee, #f472b6, #7c3aed);
    animation: spin 9s linear infinite;
  }
  .avatar img {
    position: relative;
    width: 106px;
    height: 106px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid var(--bg);
    z-index: 1;
  }
  .status {
    position: absolute;
    right: 6px;
    bottom: 8px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #22c55e;
    border: 4px solid var(--bg);
    z-index: 2;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    margin: 0;
    font-size: clamp(23px, 6.4vw, 29px);
    font-weight: 700;
    letter-spacing: .4px;
    background: linear-gradient(180deg, #fff 20%, #a8b1c2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rise .6s .06s ease both;
  }
  .sub {
    margin: 8px 0 0;
    font-size: 11.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    animation: rise .6s .1s ease both;
  }

  .panels {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .028));
    border: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    animation: rise .55s ease both;
  }
  .panel:nth-child(1) { animation-delay: .14s; }
  .panel:nth-child(2) { animation-delay: .19s; }
  .panel:nth-child(3) { animation-delay: .24s; }
  .panel:nth-child(4) { animation-delay: .29s; }
  .panel:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--ac) 55%, transparent);
    box-shadow: 0 12px 34px -14px var(--ac), 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
  }
  .panel:focus-visible {
    outline: 2px solid var(--ac);
    outline-offset: 3px;
  }
  .ico {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--ac) 17%, transparent);
    color: var(--ac);
  }
  .ico svg { width: 22px; height: 22px; }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name { font-weight: 600; font-size: 15.5px; }
  .host { color: var(--muted); font-size: 12px; }
  .arrow {
    margin-left: auto;
    flex: none;
    color: var(--muted);
    transition: transform .18s ease, color .18s ease;
  }
  .panel:hover .arrow { transform: translateX(3px); color: var(--ac); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
