  .panel {

    border-radius: 2px;
    color: #e4e4e4;
    text-decoration: none;
    transition: border-color .15s ease, background .15s ease;
  }
  .panel:hover { border-color: #9a9a9a; background: #0e0e0e; }
  .panel:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
  .ico { display: grid; place-items: center; color: #d9d9d9; }
  .ico svg { width: 24px; height: 24px; }
  .name { font-size: 13.5px; font-weight: 500; color: #cfcfcf; }

    .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
